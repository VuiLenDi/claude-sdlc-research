name: CD — Production

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy-prod:
    name: Deploy to Production (EKS)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker build -t $REGISTRY/taskflow-backend:$IMAGE_TAG ./src/backend
          docker push $REGISTRY/taskflow-backend:$IMAGE_TAG
          docker tag $REGISTRY/taskflow-backend:$IMAGE_TAG $REGISTRY/taskflow-backend:latest
          docker push $REGISTRY/taskflow-backend:latest

          docker build \
            --build-arg VITE_API_URL=${{ secrets.PROD_API_URL }} \
            -t $REGISTRY/taskflow-frontend:$IMAGE_TAG ./src/frontend
          docker push $REGISTRY/taskflow-frontend:$IMAGE_TAG

      - name: Run DB migrations (prod)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          cd src/backend
          npm ci
          npx prisma migrate deploy

      - name: Update kubeconfig (prod)
        run: aws eks update-kubeconfig --name taskflow-prod --region ap-southeast-1

      - name: Deploy to K8s (prod overlay)
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          kustomize build infrastructure/k8s/overlays/prod | \
            sed "s|REGISTRY|$REGISTRY|g; s|IMAGE_TAG|$IMAGE_TAG|g" | \
            kubectl apply -f -
          kubectl rollout status deployment/taskflow-backend --timeout=180s
          kubectl rollout status deployment/taskflow-frontend --timeout=180s

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
