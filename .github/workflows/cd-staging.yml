name: CD — Staging

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy to Staging (EKS)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/taskflow-backend:$IMAGE_TAG ./src/backend
          docker push $REGISTRY/taskflow-backend:$IMAGE_TAG
          docker tag $REGISTRY/taskflow-backend:$IMAGE_TAG $REGISTRY/taskflow-backend:staging-latest
          docker push $REGISTRY/taskflow-backend:staging-latest

      - name: Build and push frontend
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.STAGING_API_URL }} \
            -t $REGISTRY/taskflow-frontend:$IMAGE_TAG ./src/frontend
          docker push $REGISTRY/taskflow-frontend:$IMAGE_TAG

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name taskflow-staging --region ap-southeast-1

      - name: Deploy to K8s (staging overlay)
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kustomize build infrastructure/k8s/overlays/dev | \
            sed "s|REGISTRY|$REGISTRY|g; s|IMAGE_TAG|$IMAGE_TAG|g" | \
            kubectl apply -f -
          kubectl rollout status deployment/taskflow-backend --timeout=120s
          kubectl rollout status deployment/taskflow-frontend --timeout=120s
